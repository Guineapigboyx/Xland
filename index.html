<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Xland</title>
        <!-- Get rid of favicon error -->
        <!-- <link rel="icon" href="Smash poker/Stock/KOOPAG.png" /> -->

        <!-- JS Scripts -->
        <script src="scripts/constants.js"></script>
        <script src="scripts/button.js"></script>
        <script src="scripts/misc.js"></script>
        <script src="scripts/update-loop.js"></script>
        <!-- CSS stylesheet -->
        <link rel="stylesheet" href="style.css" />

        <!-- font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <header></header>
        <main class="main-content border-thin">
            <div class="toolbar">
                <button class="button massive-text Header-text pointer"></button>
                <button
                    id="world-button"
                    class="button massive-text Header-text pointer"
                    onclick="toggleScreen('world')"
                >
                    World
                </button>
                <button
                    id="status-button"
                    class="button massive-text Header-text pointer"
                    onclick="toggleScreen('status')"
                >
                    Status
                </button>
                <div id="info" class="huge-text center-text dark-bubble">
                    <div data-slot="1"></div>
                    <div data-slot="2"></div>
                    <div data-slot="3"></div>
                </div>
            </div>
            <div class="bottom-section">
                <p id="bottom-null" class="fit-div gigantic-text center-text">Nothing to show</p>
                <section class="world-screen fit-div hide"></section>
                <section class="status-screen fit-div hide"></section>
            </div>
        </main>
    </body>
</html>
