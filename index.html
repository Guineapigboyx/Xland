<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Xland</title>
        <!-- Get rid of favicon error -->
        <link rel="icon" href="Assets/inventory/BG3/equipment icons/BG3-Underwear_Icon.webp" />

        <!-- JS file indexes -->
        <!-- indexs with NO refrences to others -->
        <script src="scripts/constants.js"></script>
        <script src="Assets/indexs/type/itemUsageTypes.js"></script>
        <script src="Assets/indexs/type/statTypes.js"></script>
        <script src="Assets/indexs/type/foodTypes.js"></script>
        <!-- indexs with refrences to others -->
        <script src="Assets/indexs/type/weaponTypes.js"></script>
        <script src="Assets/indexs/equipSlots.js"></script>
        <script src="Assets/indexs/statusEffect.js"></script>
        <script src="Assets/indexs/type/damageTypes.js"></script>
        <script src="Assets/indexs/foodPrefixes.js"></script>
        <script src="Assets/indexs/attacks.js"></script>
        <script src="Assets/indexs/item.js"></script>
        <!-- character data -->
        <script src="Assets/indexs/npc.js"></script>
        <script src="Assets/indexs/pepole.js"></script>
        <script src="Assets/indexs/animal.js"></script>
        <!-- JS Scripts -->
        <script src="scripts/button.js"></script>
        <script src="scripts/misc.js"></script>
        <script src="scripts/update-loop.js"></script>
        <script src="scripts/ai.js"></script>
        <script src="scripts/game-state.js"></script>
        <!-- CSS stylesheet -->
        <link rel="stylesheet" href="style.css" />

        <!-- font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <header></header>
        <main class="main-content borde">
            <div class="toolbar">
                <button class="button massive-text Header-text pointer"></button>
                <button
                    id="world-button"
                    class="button massive-text Header-text pointer"
                    onclick="toggleScreen('world')"
                >
                    World
                </button>
                <button
                    id="status-button"
                    class="button massive-text Header-text pointer"
                    onclick="toggleScreen('status')"
                >
                    Status
                </button>
                <div id="info" class="huge-text center-text blue-bubble">
                    <div data-slot="1"></div>
                    <div data-slot="2"></div>
                    <div data-slot="3"></div>
                </div>
            </div>
            <div class="bottom-section">
                <p id="bottom-null" class="fit-div gigantic-text center-text">Nothing to show</p>
                <section class="world-screen fit-div hide"></section>
                <section class="status-screen fit-div hide">
                    <div class="status-toolbar"></div>
                    <div class="person-overview border-thin" data-slot="1">
                        <img class="person-picture" />
                        <button data-equipment="head" data-inslot class="dark-bubble"></button>
                        <div class="person-condition">
                            <div class="overview-HP dark-bubble small-text center-text">
                                <p>HP:</p>
                                <p>n/a</p>
                            </div>
                            <div class="overview-EP dark-bubble small-text center-text">
                                <p>EP:</p>
                                <p>n/a</p>
                            </div>
                        </div>
                        <button data-equipment="necklace" data-inslot class="dark-bubble"></button>
                        <button data-equipment="pants" data-inslot class="dark-bubble"></button>
                        <button data-equipment="body" data-inslot class="dark-bubble"></button>
                        <button data-equipment="hands" data-inslot class="dark-bubble"></button>
                        <button data-equipment="feet" data-inslot class="dark-bubble"></button>
                        <button data-equipment="belt" data-inslot class="dark-bubble"></button>
                        <button data-equipment="storage" data-inslot class="dark-bubble"></button>
                        <button data-equipment="mainHand" data-inslot class="dark-bubble"></button>
                        <button
                            onclick="personOverview(1)"
                            class="person-status blue-bubble small-text"
                        >
                            Full Overview
                        </button>
                        <button data-equipment="offHand" data-inslot class="dark-bubble"></button>
                        <div class="divide"></div>
                        <div class="person-inventory"></div>
                    </div>
                    <div class="person-overview border-thin" data-slot="2">
                        <img class="person-picture" />
                        <button data-equipment="head" data-inslot class="dark-bubble"></button>
                        <div class="person-condition">
                            <div class="overview-HP dark-bubble small-text center-text">
                                <p>HP:</p>
                                <p>n/a</p>
                            </div>
                            <div class="overview-EP dark-bubble small-text center-text">
                                <p>EP:</p>
                                <p>n/a</p>
                            </div>
                        </div>
                        <button data-equipment="necklace" data-inslot class="dark-bubble"></button>
                        <button data-equipment="pants" data-inslot class="dark-bubble"></button>
                        <button data-equipment="body" data-inslot class="dark-bubble"></button>
                        <button data-equipment="hands" data-inslot class="dark-bubble"></button>
                        <button data-equipment="feet" data-inslot class="dark-bubble"></button>
                        <button data-equipment="belt" data-inslot class="dark-bubble"></button>
                        <button data-equipment="storage" data-inslot class="dark-bubble"></button>
                        <button data-equipment="mainHand" data-inslot class="dark-bubble"></button>
                        <button
                            onclick="personOverview(2)"
                            class="person-status blue-bubble small-text"
                        >
                            Full Overview
                        </button>
                        <button data-equipment="offHand" data-inslot class="dark-bubble"></button>
                        <div class="divide"></div>
                        <div class="person-inventory"></div>
                    </div>
                    <div class="person-overview border-thin" data-slot="3">
                        <img class="person-picture" />
                        <button data-equipment="head" data-inslot class="dark-bubble"></button>
                        <div class="person-condition">
                            <div class="overview-HP dark-bubble small-text center-text">
                                <p>HP:</p>
                                <p>n/a</p>
                            </div>
                            <div class="overview-EP dark-bubble small-text center-text">
                                <p>EP:</p>
                                <p>n/a</p>
                            </div>
                        </div>
                        <button data-equipment="necklace" data-inslot class="dark-bubble"></button>
                        <button data-equipment="pants" data-inslot class="dark-bubble"></button>
                        <button data-equipment="body" data-inslot class="dark-bubble"></button>
                        <button data-equipment="hands" data-inslot class="dark-bubble"></button>
                        <button data-equipment="feet" data-inslot class="dark-bubble"></button>
                        <button data-equipment="belt" data-inslot class="dark-bubble"></button>
                        <button data-equipment="storage" data-inslot class="dark-bubble"></button>
                        <button data-equipment="mainHand" data-inslot class="dark-bubble"></button>
                        <button
                            onclick="personOverview(3)"
                            class="person-status blue-bubble small-text"
                        >
                            Full Overview
                        </button>
                        <button data-equipment="offHand" data-inslot class="dark-bubble"></button>
                        <div class="divide"></div>
                        <div class="person-inventory"></div>
                    </div>
                </section>
            </div>
        </main>
    </body>
</html>
