<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Xland</title>
        <!-- Get rid of favicon error -->
        <link rel="icon" href="Assets/inventory/BG3/equipment icons/BG3-Underwear_Icon.webp" />

        <!-- JS file indexes -->
        <!-- indexs with NO refrences to others -->
        <script src="Assets/indexs/sounds.js"></script>
        <script src="scripts/svg.js"></script>
        <script src="scripts/constants.js"></script>
        <script src="Assets/indexs/type/itemUsageTypes.js"></script>
        <script src="Assets/indexs/type/statTypes.js"></script>
        <script src="Assets/indexs/type/foodTypes.js"></script>
        <!-- indexs with refrences to others -->
        <script src="Assets/indexs/type/weaponTypes.js"></script>
        <script src="Assets/indexs/equipSlots.js"></script>
        <script src="Assets/indexs/statusEffect.js"></script>
        <script src="Assets/indexs/type/damageTypes.js"></script>
        <script src="Assets/indexs/foodPrefixes.js"></script>
        <script src="Assets/indexs/attacks.js"></script>
        <script src="Assets/indexs/item.js"></script>
        <!-- character data -->
        <script src="Assets/indexs/craftingSchematics.js"></script>
        <script src="Assets/indexs/npc.js"></script>
        <script src="scripts/game-state.js"></script>
        <script src="Assets/indexs/pepole.js"></script>
        <script src="Assets/indexs/animal.js"></script>
        <!-- JS Scripts -->
        <script src="scripts/displays.js"></script>
        <script src="scripts/button.js"></script>
        <script src="scripts/crafting.js"></script>
        <script src="scripts/misc.js"></script>
        <script src="scripts/event-listeners.js"></script>
        <script src="scripts/data.js"></script>
        <script src="scripts/update-loop.js"></script>
        <!-- CSS stylesheet -->
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="material.css" />

        <!-- font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <header></header>
        <main class="main-content">
            <div class="toolbar">
                <button class="border-normal button huge-text header-text pointer"></button>
                <button
                    id="interact-button"
                    class="border-normal button huge-text header-text pointer hover"
                    onclick="toggleScreen('interact')"
                >
                    Interact
                </button>
                <button
                    id="status-button"
                    class="border-normal button huge-text header-text pointer hover"
                    onclick="toggleScreen('status')"
                >
                    Status
                </button>
                <div id="info" class="huge-text center-text blue-bubble">
                    <div data-slot="1"></div>
                    <div data-slot="2"></div>
                    <div data-slot="3"></div>
                </div>
                <button
                    id="crafting-button"
                    class="border-normal button huge-text header-text pointer hover"
                    onclick="craftingScreen()"
                >
                    crafting
                </button>
                <button class="border-normal button huge-text header-text pointer hover"></button>
                <button
                    class="border-normal button huge-text header-text pointer hover"
                    onclick="testingFunction()"
                >
                    <item-icon class="fit-svg item-apple" data-material="apple"></item-icon>
                </button>
            </div>
            <div class="bottom-section">
                <p id="bottom-null" class="fit-div gigantic-text center-text">Nothing to show</p>
                <section class="interact-screen fit-div hide"></section>
                <section class="craft-screen fit-div hide">
                    <div id="crafting-grid" class="border-super-thin">
                        <section
                            id="schematics-picker"
                            class="dark-bubble square-bubble"
                            onwheel="
                                this.scrollLeft += event.deltaY // up/down scroll -> left/right scroll
                            "
                        >
                            <!-- JS inserts al the craftable schematics-->
                        </section>
                        <item-group
                            class="fit-div"
                            id="craft-preview"
                            onclick="selectModulePart(event)"
                        ></item-group>
                        <section class="flex-down" id="part-selectors">
                            <nav class="flex">
                                <button
                                    class="button-tertiary border-thin fit-div-W medium-text header-text"
                                    onclick="clickPartNav('module')"
                                    data-slot="module"
                                >
                                    Module
                                </button>
                                <button
                                    class="button-tertiary border-thin fit-div-W medium-text header-text"
                                    onclick="clickPartNav('material')"
                                    data-slot="material"
                                >
                                    Matrial
                                </button>
                            </nav>
                            <div class="fit-div hide" id="module-selector"></div>
                            <div
                                class="fit-div hide"
                                id="material-selector"
                                onclick="selectMaterialSel(event)"
                            ></div>
                        </section>
                    </div>
                    <div
                        class="inventory blue-bubble"
                        onclick="selectDiv(event, '.craft-screen > .inventory', '.inventory-item')"
                    ></div>
                    <div id="crafting-info" class="border-super-thin">
                        <div
                            id="crafting-player-dropdown"
                            onclick="
                                clickDropDown(
                                    '#crafting-player-dropdown',
                                    createOptions(getActiveTeamates(), (obj) => obj.hp > 0),
                                    event,
                                )
                            "
                            class="team-list dark-bubble square-bubble dropdown small-text upwards pointer"
                            style="border-top: 0"
                            value="N/A"
                            data-dropdown="crafting-player"
                        >
                            <label class="pointer">Select teamate</label>
                            <section class="bubble hide">
                                <option class="hover" value="N/A">Select teamate</option>
                                <option class="hover" value="N/A">koopa0</option>
                                <option class="hover" value="N/A">koopa1</option>
                                <option class="hover" value="N/A">koopa2</option>
                                <option class="hover" value="N/A">koopa3</option>
                            </section>
                        </div>
                        <section data-slot="effects" class="bubble"></section>
                        <!-- prettier-ignore -->
                        <section data-slot="stats" class="bubble small-text flex-down">
                            <div> <span>Duribility:</span> <span data-slot="duribility">N/A</span> </div>
                            <div> <span>Attack:</span> <span data-slot="attack">N/A</span></div>
                            <div> <span>Defense:</span> <span data-slot="defense">N/A</span> </div>
                            <div> <span>Accuracy bonus:</span> <span data-slot="accuracy">N/A</span> </div>
                            <div> <span>Crit chance:</span> <span data-slot="crit">N/A</span> </div>
                            <div> <span>Surge Cost:</span> <span data-slot="surge">N/A</span> </div>
                            <div> <span>Speed:</span> <span data-slot="speed">N/A</span> </div>
                            <div> <span>Range:</span> <span data-slot="range">N/A</span> </div>
                        </section>
                    </div>
                </section>
                <section class="status-screen fit-div hide">
                    <div class="status-toolbar"></div>
                    <div class="person-overview border-thin" data-slot="1">
                        <img class="person-picture" />
                        <button data-equipment="head" data-inslot class="dark-bubble"></button>
                        <div class="person-condition">
                            <div class="overview-HP dark-bubble small-text center-text">
                                <p>HP:</p>
                                <p>n/a</p>
                            </div>
                            <div class="overview-EP dark-bubble small-text center-text">
                                <p>EP:</p>
                                <p>n/a</p>
                            </div>
                        </div>
                        <button data-equipment="necklace" data-inslot class="dark-bubble"></button>
                        <button data-equipment="pants" data-inslot class="dark-bubble"></button>
                        <button data-equipment="body" data-inslot class="dark-bubble"></button>
                        <button data-equipment="hands" data-inslot class="dark-bubble"></button>
                        <button data-equipment="feet" data-inslot class="dark-bubble"></button>
                        <button data-equipment="belt" data-inslot class="dark-bubble"></button>
                        <button data-equipment="storage" data-inslot class="dark-bubble"></button>
                        <button data-equipment="mainHand" data-inslot class="dark-bubble"></button>
                        <button
                            onclick="personOverview(1)"
                            class="person-status blue-bubble small-text"
                        >
                            Full Overview
                        </button>
                        <button data-equipment="offHand" data-inslot class="dark-bubble"></button>
                        <div class="divide"></div>
                        <div class="inventory person-inventory"></div>
                    </div>
                    <div class="person-overview border-thin" data-slot="2">
                        <img class="person-picture" />
                        <button data-equipment="head" data-inslot class="dark-bubble"></button>
                        <div class="person-condition">
                            <div class="overview-HP dark-bubble small-text center-text">
                                <p>HP:</p>
                                <p>n/a</p>
                            </div>
                            <div class="overview-EP dark-bubble small-text center-text">
                                <p>EP:</p>
                                <p>n/a</p>
                            </div>
                        </div>
                        <button data-equipment="necklace" data-inslot class="dark-bubble"></button>
                        <button data-equipment="pants" data-inslot class="dark-bubble"></button>
                        <button data-equipment="body" data-inslot class="dark-bubble"></button>
                        <button data-equipment="hands" data-inslot class="dark-bubble"></button>
                        <button data-equipment="feet" data-inslot class="dark-bubble"></button>
                        <button data-equipment="belt" data-inslot class="dark-bubble"></button>
                        <button data-equipment="storage" data-inslot class="dark-bubble"></button>
                        <button data-equipment="mainHand" data-inslot class="dark-bubble"></button>
                        <button
                            onclick="personOverview(2)"
                            class="person-status blue-bubble small-text"
                        >
                            Full Overview
                        </button>
                        <button data-equipment="offHand" data-inslot class="dark-bubble"></button>
                        <div class="divide"></div>
                        <div class="inventory person-inventory"></div>
                    </div>
                    <div class="person-overview border-thin" data-slot="3">
                        <img class="person-picture" />
                        <button data-equipment="head" data-inslot class="dark-bubble"></button>
                        <div class="person-condition">
                            <div class="overview-HP dark-bubble small-text center-text">
                                <p>HP:</p>
                                <p>n/a</p>
                            </div>
                            <div class="overview-EP dark-bubble small-text center-text">
                                <p>EP:</p>
                                <p>n/a</p>
                            </div>
                        </div>
                        <button data-equipment="necklace" data-inslot class="dark-bubble"></button>
                        <button data-equipment="pants" data-inslot class="dark-bubble"></button>
                        <button data-equipment="body" data-inslot class="dark-bubble"></button>
                        <button data-equipment="hands" data-inslot class="dark-bubble"></button>
                        <button data-equipment="feet" data-inslot class="dark-bubble"></button>
                        <button data-equipment="belt" data-inslot class="dark-bubble"></button>
                        <button data-equipment="storage" data-inslot class="dark-bubble"></button>
                        <button data-equipment="mainHand" data-inslot class="dark-bubble"></button>
                        <button
                            onclick="personOverview(3)"
                            class="person-status blue-bubble small-text"
                        >
                            Full Overview
                        </button>
                        <button data-equipment="offHand" data-inslot class="dark-bubble"></button>
                        <div class="divide"></div>
                        <div class="inventory person-inventory"></div>
                    </div>
                </section>
            </div>
        </main>
    </body>
</html>
